<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libros app</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.socket.io/4.7.5/socket.io.min.js"
      integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col" style="border: 1px solid black">
          <form class="p-2">
            <div class="mb-3">
              <label for="libro-nombre" class="form-label">Nombre</label>
              <input
                type="email"
                class="form-control"
                id="libro-nombre"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="libro-descripcion" class="form-label"
                >Descripcion</label
              >
              <input type="text" class="form-control" id="libro-descripcion" />
            </div>
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="libro-habilitado"
              />
              <label class="form-check-label" for="libro-habilitado"
                >Habilitado</label
              >
            </div>
            <button type="submit" class="btn btn-primary" id="crear-libro">
              Crear
            </button>
          </form>
        </div>
        <div
          class="col"
          style="border: 1px solid black"
          id="listar-libros"
        ></div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
